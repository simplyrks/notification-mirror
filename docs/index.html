<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notifications</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --panel-2: #fafbfc; --border: #e3e6ea;
    --text: #15171c; --muted: #6a7280; --accent: #2457d6; --accent-soft: #e9efff;
    --unseen: #fff7e0; --unseen-edge: #f0b429; --danger: #c22f2f; --ok: #1f8a4c;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
    --av-l: 90%; --av-tl: 30%; --av-s: 60%;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1014; --panel: #161920; --panel-2: #1b1f27; --border: #272c35;
      --text: #e6e8ec; --muted: #949ba7; --accent: #7aa2ff; --accent-soft: #1d2a47;
      --unseen: #1f1d18; --unseen-edge: #c99a2e; --danger: #ff7d7d; --ok: #5fd08f;
      --shadow: none; --av-l: 26%; --av-tl: 84%; --av-s: 40%;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }

  .app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
  header.top {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .brand { min-width: 0; white-space: nowrap; font-weight: 650; font-size: 15px; letter-spacing: -.01em; margin-right: auto; display: flex; align-items: center; gap: 8px; }
  .brand svg { color: var(--accent); }
  .status { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }
  .status.err { color: var(--danger); }
  .status .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-right: 6px; vertical-align: 1px; }
  .status.err .dot { background: var(--danger); }
  .btn {
    border: 1px solid var(--border); background: var(--panel-2); border-radius: 8px;
    padding: 6px 10px; display: inline-flex; align-items: center; gap: 6px; line-height: 1.2;
  }
  .btn:hover { border-color: color-mix(in srgb, var(--border), var(--text) 25%); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.icon { padding: 6px; }
  .btn:disabled { opacity: .55; cursor: default; }
  select.btn { padding-right: 6px; }
  .spin { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .content { display: flex; flex-direction: column; min-height: 0; }
  .body { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 0; flex: 1; }
  aside {
    border-right: 1px solid var(--border); background: var(--panel);
    display: flex; flex-direction: column; min-height: 0;
  }
  .search { padding: 12px; border-bottom: 1px solid var(--border); }
  .search input {
    width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel-2); outline: none;
  }
  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .apps { overflow-y: auto; padding: 6px; flex: 1; }
  .app-row {
    width: 100%; display: grid; grid-template-columns: 32px 1fr auto; gap: 10px; align-items: center;
    padding: 7px 8px; border: 0; background: none; border-radius: 8px; text-align: left;
  }
  .app-row:hover { background: var(--panel-2); }
  .app-row.active { background: var(--accent-soft); }
  .app-row .name { font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .app-row .sub { color: var(--muted); font-size: 12px; }
  .app-row .right { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .count { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .badge {
    background: var(--accent); color: #fff; border-radius: 999px; font-size: 11px; font-weight: 600;
    padding: 1px 7px; font-variant-numeric: tabular-nums;
  }
  .av {
    width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center;
    font-weight: 650; font-size: 14px;
    background: hsl(var(--h) var(--av-s) var(--av-l)); color: hsl(var(--h) 55% var(--av-tl));
  }
  .av.all { background: var(--accent-soft); color: var(--accent); }
  .av.sm { width: 22px; height: 22px; border-radius: 6px; font-size: 11px; }

  main { overflow-y: auto; min-height: 0; }
  .main-inner { max-width: 820px; margin: 0 auto; padding: 18px 20px 60px; }
  .main-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .main-head h1 { font-size: 20px; margin: 0; letter-spacing: -.015em; }
  .main-head .meta { color: var(--muted); font-size: 13px; }
  .day { position: sticky; top: 0; z-index: 1; background: var(--bg); padding: 10px 2px 6px; color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .item {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; margin-bottom: 8px; box-shadow: var(--shadow); cursor: default;
  }
  .item.new { background: var(--unseen); border-left: 3px solid var(--unseen-edge); padding-left: 12px; }
  .item .line1 { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
  .item .title { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .appname { color: var(--muted); font-size: 12px; font-weight: 550; }
  .item time { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .item .text {
    white-space: pre-wrap; overflow-wrap: anywhere; color: color-mix(in srgb, var(--text), var(--muted) 25%);
    display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden;
  }
  .more { display: block; margin: 14px auto 0; }

  .empty { text-align: center; color: var(--muted); padding: 70px 20px; }
  .empty h2 { color: var(--text); font-size: 18px; margin: 12px 0 6px; }
  .empty .actions { display: flex; gap: 8px; justify-content: center; margin-top: 16px; }
  .demo-bar { background: var(--accent-soft); color: var(--accent); padding: 8px 16px; font-size: 13px; text-align: center; }
  .demo-bar button { background: none; border: 0; color: inherit; text-decoration: underline; padding: 0; }
  mark { background: color-mix(in srgb, var(--unseen-edge) 40%, transparent); color: inherit; border-radius: 2px; }

  dialog {
    border: 1px solid var(--border); border-radius: 14px; padding: 0; width: min(520px, calc(100vw - 32px));
    background: var(--panel); color: var(--text); box-shadow: 0 20px 50px rgba(0,0,0,.25);
  }
  dialog::backdrop { background: rgba(10,12,16,.45); }
  dialog form { padding: 20px; display: grid; gap: 14px; }
  dialog h2 { margin: 0; font-size: 17px; }
  dialog label { display: grid; gap: 5px; font-weight: 550; font-size: 13px; }
  dialog label small { color: var(--muted); font-weight: 400; }
  dialog input {
    padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel-2); outline: none;
  }
  dialog input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .dlg-actions { display: flex; gap: 8px; align-items: center; }
  .dlg-actions .grow { flex: 1; }
  .btn.icon.on { color: var(--accent); border-color: color-mix(in srgb, var(--accent), transparent 50%); background: var(--accent-soft); }
  .item { cursor: pointer; }
  .item:hover { border-color: color-mix(in srgb, var(--border), var(--accent) 35%); }

  #viewer { width: min(780px, calc(100vw - 32px)); max-height: calc(100vh - 48px); --vsize: 24px; }
  #viewer .v-wrap { display: flex; flex-direction: column; max-height: calc(100vh - 48px); }
  #viewer .v-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
  #viewer .v-app { font-weight: 650; font-size: 15px; }
  #viewer .v-time { color: var(--muted); font-size: 13px; }
  #viewer .v-body { padding: 24px 28px 28px; overflow-y: auto; }
  #viewer .v-title { font-size: calc(var(--vsize) * 1.2); font-weight: 680; line-height: 1.25; margin: 0 0 14px; letter-spacing: -.015em; overflow-wrap: anywhere; }
  #viewer .v-text { font-size: var(--vsize); line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
  #viewer .v-text:empty::before { content: 'No message text'; color: var(--muted); font-style: italic; }
  #viewer .v-foot { display: flex; gap: 8px; align-items: center; padding: 12px 18px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  #viewer .v-foot .grow { flex: 1; }
  #viewer .v-pos { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }

  #testResult { font-size: 13px; color: var(--muted); min-height: 1.2em; }
  #testResult.ok { color: var(--ok); } #testResult.err { color: var(--danger); }

  @media (max-width: 760px) {
    .body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
    header.top { gap: 8px; padding: 10px 12px; }
    #range { max-width: 132px; font-size: 13px; }
    aside { border-right: 0; border-bottom: 1px solid var(--border); max-height: 38vh; }
    .status { display: none; }
    .main-inner { padding: 12px 16px 40px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span>Notifications</span>
    </div>
    <span id="status" class="status"></span>
    <select id="range" class="btn" title="Time range">
      <option value="1d">Last 24 hours</option>
      <option value="7d">Last 7 days</option>
      <option value="30d">Last 30 days</option>
      <option value="all">Everything loaded</option>
    </select>
    <button id="refresh" class="btn icon" title="Refresh">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
    </button>
    <button id="notifToggle" class="btn icon" title="Mac notifications"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button>
    <button id="openSettings" class="btn icon" title="Settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>
  <div class="content">
    <div id="demoBar" class="demo-bar" hidden>Showing demo data. <button id="exitDemo">Connect your sheet</button></div>
    <div class="body">
      <aside>
        <div class="search"><input id="search" type="search" placeholder="Search notifications  ( / )" autocomplete="off"></div>
        <nav id="apps" class="apps"></nav>
      </aside>
      <main id="main"><div id="mainInner" class="main-inner"></div></main>
    </div>
  </div>
</div>

<dialog id="settings">
  <form method="dialog" id="settingsForm">
    <h2>Connect your Google Sheet</h2>
    <label>Apps Script web app URL
      <input id="cfgUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec" required>
      <small>Deploy → Manage deployments → copy the URL ending in /exec</small>
    </label>
    <label>Secret token
      <input id="cfgToken" type="password" placeholder="Printed by setup() in the Apps Script log" required autocomplete="off">
      <small>Stored only in this browser.</small>
    </label>
    <label>Refresh every (seconds)
      <input id="cfgInterval" type="number" min="10" max="3600" step="5">
    </label>
    <div class="dlg-actions">
      <button type="button" id="testNotifBtn" class="btn">Send a test Mac notification</button>
      <span id="notifStatus" style="font-size:13px; color:var(--muted)"></span>
    </div>
    <div id="testResult"></div>
    <div class="dlg-actions">
      <button type="button" id="testBtn" class="btn">Test connection</button>
      <span class="grow"></span>
      <button type="button" id="cancelBtn" class="btn">Cancel</button>
      <button type="submit" id="saveBtn" class="btn primary">Save</button>
    </div>
  </form>
</dialog>

<dialog id="viewer">
  <div class="v-wrap">
    <div class="v-head">
      <span id="vAv"></span>
      <div style="flex:1; min-width:0"><div class="v-app" id="vApp"></div><div class="v-time" id="vTime"></div></div>
      <button class="btn icon" id="vClose" title="Close (Esc)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="v-body"><h2 class="v-title" id="vTitle"></h2><div class="v-text" id="vText"></div></div>
    <div class="v-foot">
      <button class="btn" id="vPrev" title="Newer (←)">← Newer</button>
      <button class="btn" id="vNext" title="Older (→)">Older →</button>
      <span class="v-pos" id="vPos"></span>
      <span class="grow"></span>
      <button class="btn" id="vSmaller" title="Smaller text (−)">A−</button>
      <button class="btn" id="vBigger" title="Larger text (+)">A+</button>
      <button class="btn" id="vCopy">Copy</button>
    </div>
  </div>
</dialog>

<script>
(() => {
  'use strict';
  const $ = (s) => document.querySelector(s);

  // ── storage (per-browser conveniences; page still works if storage is blocked) ──
  const LS = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  const CACHE_MAX = 5000, INITIAL_LIMIT = 5000, INCR_LIMIT = 2000, PAGE = 300;
  const DAY = 864e5;
  const RANGES = { '1d': DAY, '7d': 7 * DAY, '30d': 30 * DAY, all: Infinity };

  const cfg = Object.assign({ url: '', token: '', interval: 30, notify: true }, LS.get('nm.cfg', {}));
  let currentList = [];               // what the main pane shows, for viewer ← / → navigation
  const storedSeen = LS.get('nm.seen', null);
  let seen = storedSeen || {};        // app name -> ts of newest notification already viewed
  let snapshot = { ...seen };         // seen values at the moment the current view opened (drives highlight)
  let firstRun = storedSeen === null; // first ever sync: don't flag the whole history as new
  const items = new Map();            // id -> item
  let selected = LS.get('nm.app', 'all');
  let range = LS.get('nm.range', '7d'); if (!(range in RANGES)) range = '7d';
  let query = '';
  let showN = PAGE;
  let lastSync = 0, syncError = '', syncing = false, timer = null, demo = false;

  for (const it of LS.get('nm.cache', [])) if (it && it.id) items.set(it.id, it);

  // ── utils ──
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const escRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  function hl(s, q) {
    const e = esc(s);
    if (!q) return e;
    return e.replace(new RegExp(escRe(esc(q)), 'gi'), (m) => `<mark>${m}</mark>`);
  }
  function hue(s) { let h = 0; for (const c of s) h = (h * 31 + c.codePointAt(0)) >>> 0; return h % 360; }
  function avatar(name, key, cls = '') {
    const ch = ([...String(name).trim()][0] || '?').toUpperCase();
    return `<span class="av ${cls}" style="--h:${hue(key || name)}">${esc(ch)}</span>`;
  }
  const fmtTime = (ts) => new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  function dayLabel(ts) {
    const d = new Date(ts), t = new Date();
    const start = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
    const diff = Math.round((start(t) - start(d)) / DAY);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    const opts = { weekday: 'short', day: 'numeric', month: 'short' };
    if (d.getFullYear() !== t.getFullYear()) opts.year = 'numeric';
    return d.toLocaleDateString(undefined, opts);
  }
  function ago(ts) {
    const s = Math.round((Date.now() - ts) / 1000);
    if (s < 45) return 'just now';
    if (s < 3600) return Math.round(s / 60) + ' min ago';
    if (s < 86400) return Math.round(s / 3600) + ' h ago';
    return new Date(ts).toLocaleString();
  }
  const normalize = (r) => ({
    id: String(r.id), ts: Number(r.ts) || 0, app: String(r.app || 'Unknown'),
    pkg: String(r.pkg || ''), title: String(r.title || ''), text: String(r.text || ''),
  });
  function latestByApp() {
    const m = {};
    for (const it of items.values()) if (!m[it.app] || it.ts > m[it.app]) m[it.app] = it.ts;
    return m;
  }

  // ── data ──
  async function api(params, url = cfg.url, token = cfg.token) {
    let target;
    try {
      const u = new URL(String(url).trim());
      u.searchParams.set('token', String(token).trim());
      for (const [k, v] of Object.entries(params)) u.searchParams.set(k, v);
      target = u.toString();
    } catch { throw new Error('That URL doesn’t look valid'); }
    let res;
    try { res = await fetch(target, { cache: 'no-store', redirect: 'follow' }); }
    catch { throw new Error('Could not reach the script — check the URL and your connection'); }
    if (!res.ok) throw new Error('Script returned HTTP ' + res.status);
    let data;
    try { data = await res.json(); }
    catch { throw new Error('Unexpected response — is the deployment access set to “Anyone”?'); }
    if (!data.ok) throw new Error(data.error === 'unauthorized' ? 'Token rejected by the script' : (data.error || 'Script error'));
    return data;
  }

  async function sync({ full = false } = {}) {
    if (demo || !cfg.url || !cfg.token) { render(); return; }
    if (syncing) return;
    syncing = true; setStatus();
    try {
      let since = 0;
      if (!full) for (const it of items.values()) if (it.ts > since) since = it.ts;
      const data = await api(since ? { limit: INCR_LIMIT, since } : { limit: INITIAL_LIMIT });
      if (!since) items.clear(); // full reload replaces the cache (rows deleted in the sheet disappear)
      const fresh = [];
      for (const r of data.rows) {
        const it = normalize(r);
        if (since && !items.has(it.id)) fresh.push(it);
        items.set(it.id, it);
      }
      notifyNew(fresh);
      if (firstRun) { seen = latestByApp(); snapshot = { ...seen }; LS.set('nm.seen', seen); firstRun = false; }
      markVisibleSeen();
      saveCache();
      lastSync = Date.now(); syncError = '';
    } catch (err) {
      syncError = err.message;
    } finally {
      syncing = false;
      render();
    }
  }

  function saveCache() {
    if (demo) return;
    LS.set('nm.cache', [...items.values()].sort((a, b) => b.ts - a.ts).slice(0, CACHE_MAX));
  }

  function markVisibleSeen() {
    if (document.hidden) return;
    const latest = latestByApp();
    let changed = false;
    for (const [app, ts] of Object.entries(latest)) {
      if ((selected === 'all' || selected === app) && ts > (seen[app] || 0)) { seen[app] = ts; changed = true; }
    }
    if (changed && !demo) LS.set('nm.seen', seen);
  }

  function restartTimer() {
    clearInterval(timer);
    const secs = Math.max(10, Number(cfg.interval) || 30);
    timer = setInterval(() => { if (!document.hidden || notifyActive()) sync(); }, secs * 1000);
  }

  // ── rendering ──
  function setStatus() {
    const el = $('#status');
    const refresh = $('#refresh svg');
    refresh.classList.toggle('spin', syncing);
    el.classList.toggle('err', !!syncError);
    if (demo) { el.textContent = 'Demo mode'; return; }
    if (!cfg.url) { el.textContent = 'Not connected'; return; }
    if (syncing && !lastSync) { el.textContent = 'Loading…'; return; }
    if (syncError) { el.innerHTML = `<span class="dot"></span>${esc(syncError)}`; el.title = syncError; return; }
    el.innerHTML = lastSync ? `<span class="dot"></span>Synced ${ago(lastSync)}` : '';
    el.title = lastSync ? new Date(lastSync).toLocaleString() : '';
  }

  function render() {
    setStatus();
    $('#demoBar').hidden = !demo;
    $('#range').value = range;

    const cutoff = range === 'all' ? 0 : Date.now() - RANGES[range];
    const q = query.trim().toLowerCase();
    const visible = [];
    for (const it of items.values()) {
      if (it.ts < cutoff) continue;
      if (q && !(it.app + '\n' + it.title + '\n' + it.text).toLowerCase().includes(q)) continue;
      visible.push(it);
    }
    visible.sort((a, b) => b.ts - a.ts);

    // unseen counts are over everything loaded, independent of filters
    const unseenBy = {};
    let unseenTotal = 0;
    for (const it of items.values()) if (it.ts > (seen[it.app] || 0)) { unseenBy[it.app] = (unseenBy[it.app] || 0) + 1; unseenTotal++; }
    document.title = unseenTotal ? `(${unseenTotal}) Notifications` : 'Notifications';

    const apps = new Map();
    for (const it of visible) {
      let a = apps.get(it.app);
      if (!a) apps.set(it.app, (a = { name: it.app, pkg: it.pkg, count: 0, latest: it.ts }));
      a.count++;
    }
    if (selected !== 'all' && !apps.has(selected) && !items.size) selected = 'all';

    // sidebar
    let side = `<button class="app-row ${selected === 'all' ? 'active' : ''}" data-app="all">
        <span class="av all"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></span>
        <span><div class="name">All apps</div><div class="sub">${apps.size} app${apps.size === 1 ? '' : 's'}</div></span>
        <span class="right"><span class="count">${visible.length}</span></span>
      </button>`;
    for (const a of [...apps.values()].sort((x, y) => y.latest - x.latest)) {
      const un = unseenBy[a.name] || 0;
      side += `<button class="app-row ${selected === a.name ? 'active' : ''}" data-app="${esc(a.name)}" title="${esc(a.pkg || a.name)}">
          ${avatar(a.name, a.pkg)}
          <span style="min-width:0"><div class="name">${esc(a.name)}</div><div class="sub">${esc(dayLabel(a.latest) === 'Today' ? fmtTime(a.latest) : dayLabel(a.latest))}</div></span>
          <span class="right">${un ? `<span class="badge">${un > 99 ? '99+' : un}</span>` : ''}<span class="count">${a.count}</span></span>
        </button>`;
    }
    $('#apps').innerHTML = side;

    // main
    const main = $('#mainInner');
    if (!cfg.url && !demo) {
      main.innerHTML = `<div class="empty">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
          <h2>Connect your phone's notifications</h2>
          <div>Paste your Apps Script URL and token to start reading from your Google Sheet.</div>
          <div class="actions"><button class="btn primary" data-act="settings">Open settings</button><button class="btn" data-act="demo">Try demo data</button></div>
        </div>`;
      return;
    }

    const list = selected === 'all' ? visible : visible.filter((it) => it.app === selected);
    currentList = list;
    const title = selected === 'all' ? 'All apps' : selected;
    const selPkg = selected === 'all' ? '' : (apps.get(selected) || {}).pkg;
    let html = `<div class="main-head">${selected === 'all' ? '' : avatar(selected, selPkg)}
        <div><h1>${esc(title)}</h1><div class="meta">${list.length} notification${list.length === 1 ? '' : 's'}${q ? ` matching “${esc(query.trim())}”` : ''} · ${esc($('#range').selectedOptions[0].textContent.toLowerCase())}</div></div></div>`;

    if (!list.length) {
      html += `<div class="empty"><h2>${syncing && !lastSync ? 'Loading…' : 'Nothing here'}</h2><div>${q ? 'No notifications match your search.' : 'No notifications in this time range.'}</div></div>`;
    } else {
      let day = '';
      for (const it of list.slice(0, showN)) {
        const d = dayLabel(it.ts);
        if (d !== day) { html += `<div class="day">${esc(d)}</div>`; day = d; }
        const isNew = it.ts > (snapshot[it.app] || 0);
        html += `<article class="item ${isNew ? 'new' : ''}" data-id="${esc(it.id)}" title="Click to read in large text">
            <div class="line1">
              ${selected === 'all' ? avatar(it.app, it.pkg, 'sm') + `<span class="appname">${esc(it.app)}</span>` : ''}
              <span class="title">${hl(it.title || (selected === 'all' ? '' : it.app), q)}</span>
              <time title="${esc(new Date(it.ts).toLocaleString())}">${fmtTime(it.ts)}</time>
            </div>
            ${it.text ? `<div class="text">${hl(it.text, q)}</div>` : ''}
          </article>`;
      }
      if (list.length > showN) html += `<button class="btn more" data-act="more">Show ${Math.min(PAGE, list.length - showN)} more of ${list.length - showN}</button>`;
    }
    main.innerHTML = html;
  }

  // ── demo ──
  function loadDemo() {
    demo = true; items.clear(); seen = {}; snapshot = {};
    const now = Date.now();
    const src = [
      ['WhatsApp', 'com.whatsapp', [['Mom', 'Did you eat lunch?'], ['College Friends', 'Aman: who is in for Saturday?\nNeha: me!'], ['Priya', 'Sending the photos now'], ['Office Team', 'Standup moved to 11:30']]],
      ['Gmail', 'com.google.android.gm', [['Your statement is ready', 'Your November statement is now available to view.'], ['Interview confirmation', 'Thanks for confirming. See you Tuesday at 3 PM.'], ['Weekly digest', '5 new posts from people you follow']]],
      ['Instagram', 'com.instagram.android', [['Instagram', 'rohan_k liked your photo.'], ['Instagram', 'You have 3 new follow requests']]],
      ['Swiggy', 'in.swiggy.android', [['Order picked up', 'Your order is on the way. Arriving in 18 mins.'], ['Delivered', 'Enjoy your meal!']]],
      ['Slack', 'com.Slack', [['#design', 'Kiran: pushed the new mockups'], ['Direct message', 'Can you review the PR before EOD?']]],
      ['Calendar', 'com.samsung.android.calendar', [['Team sync', '10:00 – 10:30 · Meet'], ['Dentist', 'Tomorrow 6:00 PM']]],
      ['Phone', 'com.samsung.android.dialer', [['Missed call', '+91 98xxx xx210']]],
    ];
    for (let i = 0; i < 70; i++) {
      const [app, pkg, msgs] = src[(i * 5 + Math.floor(i / 3)) % src.length];
      const [title, text] = msgs[Math.floor(i / src.length) % msgs.length];
      const ts = now - Math.floor((i * i * 0.9 + i * 25) * 60 * 1000);
      const id = 'demo' + i;
      items.set(id, { id, ts, app, pkg, title, text });
    }
    // everything older than the 6 newest counts as already seen, so badges are visible
    const sorted = [...items.values()].sort((a, b) => b.ts - a.ts);
    for (const it of sorted.slice(6)) if (it.ts > (seen[it.app] || 0)) seen[it.app] = it.ts;
    snapshot = { ...seen };
    selected = 'all'; showN = PAGE;
    render();
  }
  function exitDemo() {
    demo = false; items.clear();
    for (const it of LS.get('nm.cache', [])) if (it && it.id) items.set(it.id, it);
    seen = LS.get('nm.seen', {}) || {}; snapshot = { ...seen };
    openSettings();
    render();
  }

  // ── settings ──
  function openSettings() {
    $('#cfgUrl').value = cfg.url;
    $('#cfgToken').value = cfg.token;
    $('#cfgInterval').value = cfg.interval;
    $('#testResult').textContent = ''; $('#testResult').className = '';
    $('#notifStatus').textContent = canNotify() ? `Browser permission: ${Notification.permission}${cfg.notify ? '' : ' (turned off in this page)'}` : '';
    $('#settings').showModal();
  }
  $('#testBtn').addEventListener('click', async () => {
    const r = $('#testResult');
    r.className = ''; r.textContent = 'Testing…';
    try {
      const d = await api({ limit: 1 }, $('#cfgUrl').value, $('#cfgToken').value);
      r.className = 'ok'; r.textContent = `Connected — ${d.total} notification${d.total === 1 ? '' : 's'} in the sheet.`;
    } catch (err) { r.className = 'err'; r.textContent = err.message; }
  });
  $('#cancelBtn').addEventListener('click', () => $('#settings').close());
  $('#settingsForm').addEventListener('submit', () => {
    const changed = cfg.url !== $('#cfgUrl').value.trim() || cfg.token !== $('#cfgToken').value.trim();
    cfg.url = $('#cfgUrl').value.trim();
    cfg.token = $('#cfgToken').value.trim();
    cfg.interval = Math.max(10, Number($('#cfgInterval').value) || 30);
    LS.set('nm.cfg', cfg);
    if (demo) { demo = false; items.clear(); seen = LS.get('nm.seen', {}) || {}; snapshot = { ...seen }; }
    if (changed) { items.clear(); lastSync = 0; }
    syncError = '';
    restartTimer();
    sync({ full: true });
  });

  // ── Mac notifications (browser Notification API; works while this page is open, even in the background) ──
  const canNotify = () => 'Notification' in window;
  const notifyActive = () => cfg.notify && canNotify() && Notification.permission === 'granted';
  const MAX_INDIVIDUAL = 4;

  function notifyNew(list) {
    if (!list.length || !notifyActive() || demo) return;
    list.sort((a, b) => a.ts - b.ts);
    if (list.length > MAX_INDIVIDUAL) {
      const newest = list[list.length - 1];
      const n = new Notification(`${list.length} new notifications`, {
        body: list.slice(-5).reverse().map((it) => `${it.app}: ${it.title || it.text}`.slice(0, 80)).join('\n'),
        tag: 'nm-summary',
      });
      n.onclick = (e) => { e.preventDefault(); window.focus(); selectApp('all'); openViewer(newest.id); n.close(); };
      return;
    }
    for (const it of list) {
      const n = new Notification(it.title ? `${it.app} · ${it.title}` : it.app, {
        body: it.text.slice(0, 500),
        tag: it.id,
      });
      n.onclick = (e) => { e.preventDefault(); window.focus(); openViewer(it.id); n.close(); };
    }
  }

  function updateNotifBtn() {
    const b = $('#notifToggle');
    const perm = canNotify() ? Notification.permission : 'unsupported';
    b.classList.toggle('on', notifyActive());
    b.title = perm === 'granted' ? (cfg.notify ? 'Mac notifications: on (click to turn off)' : 'Mac notifications: off (click to turn on)')
      : perm === 'denied' ? 'Mac notifications are blocked — click for help'
      : perm === 'unsupported' ? 'This browser does not support notifications'
      : 'Turn on Mac notifications';
  }

  async function toggleNotif() {
    if (!canNotify()) { alert('This browser does not support notifications. Use Chrome or Safari.'); return; }
    if (location.protocol === 'file:') {
      alert('Browsers don’t allow notifications from a page opened as a file.\n\nOpen this page from its web address instead (GitHub Pages, or http://localhost).');
      return;
    }
    if (Notification.permission === 'default') {
      const p = await Notification.requestPermission();
      if (p === 'granted') {
        cfg.notify = true;
        new Notification('Notifications are on', { body: 'New phone notifications will pop up here while this page is open — even in a background tab.' });
      }
    } else if (Notification.permission === 'granted') {
      cfg.notify = !cfg.notify;
    } else {
      alert('Notifications are blocked for this page.\n\n1. Click the icon left of the address bar → Notifications → Allow, then reload.\n2. Also check System Settings → Notifications → your browser → Allow notifications.');
    }
    LS.set('nm.cfg', cfg);
    updateNotifBtn();
    restartTimer();
  }

  // ── large-text viewer ──
  let viewerList = [], viewerIdx = -1;
  let vsize = Math.min(44, Math.max(16, Number(LS.get('nm.vsize', 24)) || 24));

  function openViewer(id) {
    const it = items.get(id);
    if (!it) return;
    viewerList = currentList.some((x) => x.id === id) ? currentList : [...items.values()].sort((a, b) => b.ts - a.ts);
    viewerIdx = viewerList.findIndex((x) => x.id === id);
    showViewerItem();
    if (!$('#viewer').open) $('#viewer').showModal();
  }
  function showViewerItem() {
    const it = viewerList[viewerIdx];
    if (!it) return;
    $('#viewer').style.setProperty('--vsize', vsize + 'px');
    $('#vAv').innerHTML = avatar(it.app, it.pkg);
    $('#vApp').textContent = it.app;
    $('#vTime').textContent = new Date(it.ts).toLocaleString(undefined, { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    $('#vTitle').textContent = it.title;
    $('#vTitle').hidden = !it.title;
    $('#vText').textContent = it.text;
    $('#vPos').textContent = viewerList.length > 1 ? `${viewerIdx + 1} of ${viewerList.length}` : '';
    $('#vPrev').disabled = viewerIdx <= 0;
    $('#vNext').disabled = viewerIdx >= viewerList.length - 1;
    $('#vCopy').textContent = 'Copy';
    $('#viewer .v-body').scrollTop = 0;
  }
  function stepViewer(d) {
    const n = viewerIdx + d;
    if (n < 0 || n >= viewerList.length) return;
    viewerIdx = n; showViewerItem();
  }
  function resizeViewer(d) {
    vsize = Math.min(44, Math.max(16, vsize + d));
    LS.set('nm.vsize', vsize);
    $('#viewer').style.setProperty('--vsize', vsize + 'px');
  }
  $('#vClose').addEventListener('click', () => $('#viewer').close());
  $('#viewer').addEventListener('click', (e) => { if (e.target === $('#viewer')) $('#viewer').close(); }); // click backdrop
  $('#vPrev').addEventListener('click', () => stepViewer(-1));
  $('#vNext').addEventListener('click', () => stepViewer(1));
  $('#vSmaller').addEventListener('click', () => resizeViewer(-2));
  $('#vBigger').addEventListener('click', () => resizeViewer(2));
  $('#vCopy').addEventListener('click', async () => {
    const it = viewerList[viewerIdx];
    try { await navigator.clipboard.writeText([it.title, it.text].filter(Boolean).join('\n')); $('#vCopy').textContent = 'Copied'; }
    catch { $('#vCopy').textContent = 'Copy failed'; }
  });
  $('#viewer').addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') { e.preventDefault(); stepViewer(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); stepViewer(1); }
    else if (e.key === '+' || e.key === '=') resizeViewer(2);
    else if (e.key === '-') resizeViewer(-2);
  });
  $('#notifToggle').addEventListener('click', toggleNotif);
  $('#testNotifBtn').addEventListener('click', async () => {
    const st = $('#notifStatus');
    if (!canNotify()) { st.textContent = 'This browser does not support notifications.'; return; }
    if (Notification.permission === 'default') await Notification.requestPermission();
    if (Notification.permission !== 'granted') { st.textContent = 'Browser permission: ' + Notification.permission; return; }
    cfg.notify = true; LS.set('nm.cfg', cfg); updateNotifBtn(); restartTimer();
    const newest = [...items.values()].sort((a, b) => b.ts - a.ts)[0];
    try {
      const n = new Notification(newest ? `${newest.app} · ${newest.title}` : 'Test notification', {
        body: newest ? newest.text.slice(0, 500) : 'Mac notifications are working.', tag: 'nm-test',
      });
      n.onclick = (e) => { e.preventDefault(); window.focus(); $('#settings').close(); if (newest) openViewer(newest.id); n.close(); };
      st.textContent = 'Sent. Look at the top-right of your screen.';
    } catch (err) { st.textContent = 'Failed: ' + err.message; }
  });

  function selectApp(app) {
    selected = app;
    LS.set('nm.app', selected);
    snapshot = { ...seen };
    markVisibleSeen();
    showN = PAGE;
    render();
    $('#main').scrollTop = 0;
  }

  // ── events ──
  $('#apps').addEventListener('click', (e) => {
    const row = e.target.closest('.app-row');
    if (!row) return;
    selectApp(row.dataset.app);
  });
  $('#mainInner').addEventListener('click', (e) => {
    const act = e.target.closest('[data-act]');
    if (act) {
      if (act.dataset.act === 'settings') openSettings();
      else if (act.dataset.act === 'demo') loadDemo();
      else if (act.dataset.act === 'more') { showN += PAGE; render(); }
      return;
    }
    if (window.getSelection().toString()) return; // let people select text
    const item = e.target.closest('.item');
    if (item) openViewer(item.dataset.id);
  });
  $('#search').addEventListener('input', (e) => { query = e.target.value; showN = PAGE; render(); });
  $('#range').addEventListener('change', (e) => { range = e.target.value; LS.set('nm.range', range); showN = PAGE; render(); });
  $('#refresh').addEventListener('click', () => sync({ full: !lastSync }));
  $('#openSettings').addEventListener('click', openSettings);
  $('#exitDemo').addEventListener('click', exitDemo);
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) && !$('#settings').open && !$('#viewer').open) {
      e.preventDefault(); $('#search').focus();
    } else if (e.key === 'Escape' && document.activeElement === $('#search')) {
      $('#search').value = ''; query = ''; render(); $('#search').blur();
    }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    markVisibleSeen(); render(); sync();
  });
  setInterval(setStatus, 15000);

  // ── start ──
  updateNotifBtn();
  render();
  if (cfg.url && cfg.token) { restartTimer(); sync({ full: true }); }
})();
</script>
</body>
</html>
